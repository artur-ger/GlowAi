name: glowai

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/glowai.db
    volumes:
      - ./backend/app:/app/app
      - ./backend/web:/app/web
      - ./backend/legal:/app/legal
      - glowai_data:/data
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

volumes:
  glowai_data:
