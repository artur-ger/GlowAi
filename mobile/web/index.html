<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GlowAi — план ухода за кожей к поездке с учётом климата.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GlowAi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GlowAi</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Native HTML fields used by CustomAddField on web — must stay readable. */
    input.glowai-native-input {
      color: #142429 !important;
      -webkit-text-fill-color: #142429 !important;
      background: #ffffff !important;
      background-color: #ffffff !important;
      caret-color: #0F6E6A !important;
      opacity: 1 !important;
    }
    input.glowai-native-input:focus {
      border-color: #0F6E6A !important;
    }
    input.glowai-native-input::placeholder {
      color: #5A6B70 !important;
      opacity: 1 !important;
    }
  </style>
</head>
<body style="background-color:#EFF5F4;margin:0;overflow:hidden;">
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
